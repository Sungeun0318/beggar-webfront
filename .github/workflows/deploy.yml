name: React Client Deploy to S3   # [필수] GitHub Actions 이름 (가독성 용)

on:                                               # [필수] 언제 실행할지 정의
  push:                                           # [필수] push 이벤트 기반 실행
    branches: [ "feat/connect-deployed-backend" ] # [필수] feat/connect-deployed-backend 브랜치에 push될 때만 실행됨

jobs:                             # [필수] 작업(Job) 집합 정의
  build-and-deploy:               # [필수] Job 이름
    runs-on: ubuntu-latest        # [필수] 실행 OS (GitHub 제공 환경)

    steps:                        # [필수] 단계별 작업 정의
      # 1. Git Source Code Checkout
      - name: Checkout source                   # [필수] 소스코드 가져오기
        uses: actions/checkout@v3               # [필수] GitHub 공식 checkout 액션

      # 2. Node.js 설치 (React 빌드 기준)
      - name: Set up Node.js                    # [필수] Node.js 설치
        uses: actions/setup-node@v3             # [필수] 노드 설정 액션
        with:
          node-version: '20'                    # [필수] 프로젝트 Node.js 버전 정의

      # 3. 배포 환경 파일 생성
      - name: Create .env file                  # [필수] 배포 환경 환경변수 파일 생성 
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> .env
        shell: bash

      # 4. NPM 의존성 설치 및 빌드
      - name: Install dependencies and Build    # [필수] 리액트 빌드 (정적 파일 생성)
        run: |
          npm install
          npm run build
        shell: bash                             # [필수] bash 쉘 사용

      # 5. AWS 자격 증명 설정
      - name: Configure AWS Credentials                               # [필수] AWS 권한 인증 단계
        uses: aws-actions/configure-aws-credentials@v2                # [필수] AWS 공식 자격증명 액션
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}         # [필수] IAM Key
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # [필수] IAM Secret
          aws-region: ap-northeast-2                                  # [필수] AWS 서울리전

      # 6. AWS S3 버킷 동기화 배포
      - name: Deploy to S3                                            # [필수] S3 버킷으로 배포하는 단계
        run: aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} --delete
        shell: bash                                                   # [필수] bash 쉘 사용